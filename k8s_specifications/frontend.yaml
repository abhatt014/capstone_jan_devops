apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec: # Indented correctly under 'template'
      containers:
      - name: frontend
        image: docker.io/amitfreeze/frontend:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: capstone
spec:
  type: NodePort # Added to allow nodePort mapping
  selector:
    app: frontend
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30000