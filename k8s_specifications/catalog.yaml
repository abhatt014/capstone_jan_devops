apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: capstonespec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: docker.io/amitfreeze/catalog_service:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: capstonespec:
  selector:
    app: catalog
  ports:
  - port: 5001
    targetPort: 5001       
