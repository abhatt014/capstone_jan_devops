apiVersion: apps/v1
kind: deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
  spec:
    containers:
    - name: catalog
      image: docker.io/amitfreeze/catalog_service:latest
      ports:
      - containerPort: 5000
---
apiVersion: v1
kind: service
metadata:
  name: catalog
spec:
  selector:
    app: catalog
  ports:
  - port: 5000
    targetPort: 5000         
