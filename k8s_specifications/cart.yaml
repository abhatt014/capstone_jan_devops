apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: capstonenew # Added to match the Service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec: # Indented correctly under 'template'
      containers:
      - name: cart
        image: docker.io/amitfreeze/cart_service:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: capstonenew
spec:
  selector:
    app: cart
  ports:
  - port: 5002
    targetPort: 5002