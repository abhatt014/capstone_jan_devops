apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  # Ensure these database names match exactly what your Python code expects (e.g., ecomm_db or catalog_db)
  init.sql: |
    CREATE DATABASE IF NOT EXISTS catalog_db;
    USE catalog_db;
    CREATE TABLE products (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100), price DECIMAL(10,2), stock INT);
    INSERT INTO products (name, price, stock) VALUES ('Laptop', 999.99, 10), ('Smartphone', 499.50, 20), ('Headphones', 89.00, 50);
    
    CREATE DATABASE IF NOT EXISTS cart_db;
    USE cart_db;
    CREATE TABLE cart_items (id INT AUTO_INCREMENT PRIMARY KEY, user_id INT, product_id INT, quantity INT);
    
    CREATE DATABASE IF NOT EXISTS order_db;
    USE order_db;
    CREATE TABLE orders (id INT AUTO_INCREMENT PRIMARY KEY, user_id INT, status VARCHAR(20) DEFAULT 'Pending');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpassword
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-script
        configMap:
          name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306