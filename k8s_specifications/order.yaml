apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
      - name: order
        image: docker.io/amitfreeze/order_service:28
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: capstone
spec:
  selector:
    app: order
  ports:
  - port: 5003
    targetPort: 5003        
