<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Order Management (Admin)</h1>
        <a href="/" class="btn btn-outline-secondary">Back to Shop</a>
    </div>

    <table class="table table-bordered table-striped bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Order ID</th>
                <th>User ID</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
                <td>{{ order.id }}</td>
                <td>{{ order.user_id }}</td>
                <td>
                    <span class="badge {% if order.status == 'Pending' %}bg-warning{% else %}bg-success{% endif %}">
                        {{ order.status }}
                    </span>
                </td>
                <td>
                    {% if order.status == 'Pending' %}
                    <a href="/approve/{{ order.id }}" class="btn btn-sm btn-primary">Process Order</a>
                    {% else %}
                    <button class="btn btn-sm btn-secondary" disabled>Processed</button>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
