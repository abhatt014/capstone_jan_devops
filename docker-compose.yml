version: '3.8'
services:
  mysql_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  catalog:
    build: ./catalog_service
    ports:
      - "5001:5001"
    depends_on:
      mysql_db:
        condition: service_healthy

  cart:
    build: ./cart_service
    ports:
      - "5002:5002"
    depends_on:
      mysql_db:
        condition: service_healthy

  order:
    build: ./order_service
    ports:
      - "5003:5003"
    depends_on:
      mysql_db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    depends_on:
      - catalog
      - cart
      - order