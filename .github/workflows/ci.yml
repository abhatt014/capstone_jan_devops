name: Microservices CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: docker compose build

      - name: Start Services (and wait for healthchecks)
        # The --wait flag pauses the workflow until the mysql_db healthcheck passes
        run: docker compose up -d --wait

      - name: Verify Frontend Gateway (Port 5000)
        run: |
          echo "Testing Frontend UI..."
          curl --fail http://localhost:5000 || exit 1

      - name: Verify Catalog Service API (Port 5001)
        run: |
          echo "Testing Catalog API..."
          curl --fail http://localhost:5001/products || exit 1

      - name: Verify Cart Service API (Port 5002)
        # Using a dummy user_id to ensure the API returns a valid 200 response
        run: |
          echo "Testing Cart API..."
          curl --fail http://localhost:5002/cart/999 || exit 1

      - name: Capture Container Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Tear Down Services
        if: always()
        run: docker compose down -v
